<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Classifier</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Century Gothic', Arial, sans-serif;
            background-color: lightblue;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container */
        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Heading */
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        /* Input Fields */
        form input[type="number"],
        form input[type="radio"] {
            margin-top: 10px;
            font-size: 1rem;
            padding: 5px;
        }

        form input[type="number"] {
            width: calc(100% - 10px);
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Submit Button */
        form input[type="submit"] {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        form input[type="submit"]:hover {
            background-color: #0056b3;
        }

        /* Accessibility Improvement */
        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-size: 1rem;
        }

        /* Message Display */
        h2 {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Diabetes Classifier</h1>
        <form method="POST">
            <!-- Fasting Sugar Input -->
            <label for="fs">Enter Fasting Sugar:</label>
            <input id="fs" type="number" step="0.01" name="fs" placeholder="Enter Fasting Sugar" required min="0" />

            <!-- Follow-Up Question -->
            <p>Have you previously been diagnosed with diabetes?</p>
            <label><input type="radio" name="fu" value="1" checked /> No</label>
            <label><input type="radio" name="fu" value="2" /> Yes</label>

            <!-- Submit Button -->
            <input type="submit" value="Submit" />
        </form>

        <!-- Message Display -->
        <h2>{{msg}}</h2>
    </div>
</body>
</html>
